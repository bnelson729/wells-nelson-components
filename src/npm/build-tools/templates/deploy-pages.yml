# GitHub Pages deploy for a SvelteKit adapter-static app.
# Copy to .github/workflows/deploy.yml and replace __REPO__ with the repository name.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables).
          # Leave the Supabase ones unset to deploy a local-only build.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # "/__REPO__" for <user>.github.io/__REPO__; set BASE_PATH to "/" for a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || '/__REPO__' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
