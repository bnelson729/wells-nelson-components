# Template (@wells-nelson/build-tools): copy to .github/workflows/deploy.yml and replace __REPO__ with the
# repository name (the GitHub Pages project path).

name: Deploy to GitHub Pages

# Every push to main is checked (the shared site-ci.yml, as on pull requests), then deployed and
# released as a new version (site-deploy.yml). When the check swaps local tarballs for published
# packages, it commits that to main instead, and the run for that commit deploys. Run it by hand to
# bump the minor or major version. Reads the repository variables SUPABASE_URL, SUPABASE_ANON_KEY
# and, for a custom domain, BASE_PATH, and the PAT secret.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

# One deploy at a time; a newer push waits for the running one instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: bnelson729/wells-nelson-components/.github/workflows/site-ci.yml@v2
    permissions:
      contents: write
    secrets:
      token: ${{ secrets.PAT }}

  deploy:
    needs: ci
    # The check committed published packages: that commit's own run deploys.
    if: needs.ci.outputs.committed != 'true'
    uses: bnelson729/wells-nelson-components/.github/workflows/site-deploy.yml@v2
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      base-path: /__REPO__
      increment: ${{ inputs.increment || 'patch' }}
