# Template (@wells-nelson/build-tools): copy to .github/workflows/deploy.yml and replace __REPO__ with the
# repository name (the GitHub Pages project path).

name: Deploy to GitHub Pages

# Every merge to main deploys and releases a new version (the shared site-deploy.yml). Run it by
# hand to bump the minor or major version. Reads the repository variables SUPABASE_URL,
# SUPABASE_ANON_KEY and, for a custom domain, BASE_PATH.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

# One deploy at a time; a newer push waits for the running one instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: bnelson729/wells-nelson-components/.github/workflows/site-deploy.yml@main
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      base-path: /__REPO__
      increment: ${{ inputs.increment || 'patch' }}
