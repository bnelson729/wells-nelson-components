# Template (@wells-nelson/build-tools): copy to .github/workflows/ci.yml as is.

name: CI

# The pull request check (the shared site-ci.yml): swaps local @wells-nelson tarballs for the
# published versions and commits that to the branch, then type-check, lint, formatting, unit tests
# and a production build. Branch protection requires the check "ci / Check, test and build".
# The swap is pushed with the PAT repository secret, so the checks run again on the new commit.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: bnelson729/wells-nelson-components/.github/workflows/site-ci.yml@v2
    permissions:
      contents: write
    secrets:
      token: ${{ secrets.PAT }}
