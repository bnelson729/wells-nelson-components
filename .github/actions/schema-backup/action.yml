name: Schema backup
description: >-
  pg_dump of one schema, restored into a scratch Postgres to prove it restores (each table's row
  count must land between the counts taken right before and after the dump), then encrypted with
  the database password. Uses the repository's ops/sql (GitHub downloads the whole repository for
  an action, at the same version). Needs the Postgres client (postgres-client) and a scratch
  database (a service container).

inputs:
  schema:
    description: The Postgres schema to back up
    required: true
  db-url:
    description: Connection string of the database, without the password
    required: true
  password:
    description: The database password (also the backup's passphrase)
    required: true
  scratch-url:
    description: Connection string of an empty scratch database to restore into
    required: true

outputs:
  file:
    description: The encrypted backup (.dump.gpg), in the working directory
    value: ${{ steps.encrypt.outputs.file }}

runs:
  using: composite
  steps:
    - name: The database password is there
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.password }}
      run: |
        if [ -z "$PGPASSWORD" ]; then
          echo "::error::The database password is empty. Add SUPABASE_DB_PASSWORD to the database environment, and call the workflow with 'secrets: inherit'."
          exit 1
        fi

    - name: Dump the schema
      id: dump
      shell: bash
      env:
        SCHEMA: ${{ inputs.schema }}
        DB_URL: ${{ inputs.db-url }}
        PGPASSWORD: ${{ inputs.password }}
        SQL: ${{ github.action_path }}/../../../ops/sql
      run: |
        file="$SCHEMA-$(date -u +%Y-%m-%dT%H%MZ).dump"
        echo "file=$file" >> "$GITHUB_OUTPUT"
        count() { psql "$DB_URL" -v ON_ERROR_STOP=1 -At -v schema="$SCHEMA" -f "$SQL/row-counts.sql" | LC_ALL=C sort; }
        # Row counts right before and after the dump: the restore must land in between.
        count > "$RUNNER_TEMP/counts-before.txt"
        pg_dump "$DB_URL" --schema="$SCHEMA" --format=custom --no-owner --file="$file"
        count > "$RUNNER_TEMP/counts-after.txt"
        cat "$RUNNER_TEMP/counts-after.txt"

    - name: Restore it into the scratch database
      shell: bash
      env:
        SCHEMA: ${{ inputs.schema }}
        SCRATCH: ${{ inputs.scratch-url }}
        FILE: ${{ steps.dump.outputs.file }}
        SQL: ${{ github.action_path }}/../../../ops/sql
      run: |
        cd "$RUNNER_TEMP"
        # The parts of a Supabase database the schema refers to (roles, auth, realtime).
        psql "$SCRATCH" -v ON_ERROR_STOP=1 -qf "$SQL/scratch-stub.sql"
        pg_restore --dbname="$SCRATCH" --no-owner --exit-on-error "$GITHUB_WORKSPACE/$FILE"
        psql "$SCRATCH" -v ON_ERROR_STOP=1 -At -v schema="$SCHEMA" -f "$SQL/row-counts.sql" | LC_ALL=C sort > counts-restored.txt
        # table before after restored, for every table counted before the dump.
        LC_ALL=C join counts-before.txt counts-after.txt | LC_ALL=C join - counts-restored.txt > counts.txt
        if [ "$(wc -l < counts.txt)" -ne "$(wc -l < counts-before.txt)" ]; then
          echo "::error::Some tables are missing from the restored database."; cat counts-before.txt counts-restored.txt; exit 1
        fi
        awk '{ lo = ($2 < $3) ? $2 : $3; hi = ($2 > $3) ? $2 : $3;
               if ($4 < lo || $4 > hi) { printf "::error::%s: %s rows restored, expected %s to %s\n", $1, $4, lo, hi; bad = 1 } }
             END { exit bad }' counts.txt
        echo "Restore test: $(wc -l < counts.txt) tables, $(awk '{ n += $4 } END { print n }' counts.txt) rows restored." >> "$GITHUB_STEP_SUMMARY"

    - name: Encrypt with the database password
      id: encrypt
      shell: bash
      env:
        PASSPHRASE: ${{ inputs.password }}
        FILE: ${{ steps.dump.outputs.file }}
      run: |
        printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
          --symmetric --cipher-algo AES256 --output "$FILE.gpg" "$FILE"
        rm "$FILE"
        echo "file=$FILE.gpg" >> "$GITHUB_OUTPUT"
