name: Local tarball dependencies
description: >-
  Finds packages that package.json installs from local tarballs. When there are some, checks out
  the branch itself (a pull request's branch, or the pushed branch) so a swap can be committed to
  it. Fails for a fork's pull request (its branch can't be pushed to), and for a commit that already
  has the `Published-packages:` trailer (the loop guard: that was a swap's own commit). Run it in a
  checkout made with the token the swap is pushed with.

outputs:
  found:
    description: "'true' when package.json installs local tarballs"
    value: ${{ steps.find.outputs.found }}
  branch:
    description: The branch now checked out, which the swap is committed to
    value: ${{ steps.find.outputs.branch }}

runs:
  using: composite
  steps:
    - id: find
      shell: bash
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        if ! grep -n '"file:[^"]*\.tgz"' package.json; then
          echo "None."
          exit 0
        fi
        if [ "$FORK" = "true" ]; then
          echo "::error::package.json installs packages from local tarballs, and a fork's branch can't be updated here. Point them at published versions."
          exit 1
        fi
        # The branch itself, not a pull request's merge commit: the swap is committed to it.
        git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH"
        git checkout -B "$BRANCH" FETCH_HEAD
        if git log -1 --format=%B | grep -q '^Published-packages:'; then
          echo "::error::The latest commit already switched to published packages, yet package.json still installs local tarballs. Not committing again (it would loop); fix package.json by hand."
          exit 1
        fi
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
