name: Use published packages

# Reusable workflow for apps that try out unreleased packages from local tarballs
# (`"@wells-nelson/displays": "file:../packs/wells-nelson-displays-0.0.0.tgz"`). On a pull
# request it swaps every such dependency for the latest published version (`^x.y.z`), reinstalls,
# runs the app's checks and, if they pass, commits package.json and package-lock.json to the
# pull request branch. With no tarball dependencies it does nothing.
#
# Call it from the app's repository:
#
#   on:
#     pull_request:
#   permissions:
#     contents: write
#   jobs:
#     packages:
#       uses: bnelson729/wells-nelson-components/.github/workflows/use-published-packages.yml@main
#       with:
#         verify: npm run check && npm run build
#
# Pull requests from forks are skipped (their branches can't be pushed to). A commit pushed with
# the default GITHUB_TOKEN doesn't start new workflow runs; pass a `token` secret (a fine-grained
# token with Contents: write) if the pull request's other checks should re-run on it.

on:
  workflow_call:
    inputs:
      scope:
        description: Only replace tarball dependencies whose name starts with this ('' for any package)
        type: string
        default: '@wells-nelson/'
      dist-tag:
        description: npm dist-tag to resolve the published version from
        type: string
        default: latest
      verify:
        description: Shell commands that must pass before committing
        type: string
        default: npm run check --if-present && npm test --if-present && npm run build --if-present
      node-version:
        description: Node.js version
        type: string
        default: '24'
      working-directory:
        description: Directory that holds package.json
        type: string
        default: .
      commit-message:
        description: Message of the commit with the updated package files
        type: string
        default: Use published packages instead of local tarballs
    secrets:
      token:
        description: Token to push with instead of GITHUB_TOKEN (so the push re-runs the pull request's checks)
        required: false
    outputs:
      replaced:
        description: The packages that were switched to published versions (space-separated name@range), or empty
        value: ${{ jobs.published.outputs.replaced }}

jobs:
  published:
    name: Replace local tarballs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: use-published-packages-${{ github.head_ref }}
      cancel-in-progress: true
    outputs:
      replaced: ${{ steps.find.outputs.replaced }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The branch itself (not the merge commit), so the result can be pushed back to it.
          ref: ${{ github.head_ref }}
          token: ${{ secrets.token || github.token }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # Every tarball spec is rewritten before anything is installed: an install sees the whole
      # tree, so a tarball left for later (its path only exists on the machine that packed it)
      # would fail it.
      - name: Point tarball dependencies at their published versions
        id: find
        env:
          SCOPE: ${{ inputs.scope }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          node <<'EOF'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync, existsSync, readFileSync, writeFileSync } = require('node:fs');
          // Keep the file's own indentation and final newline.
          const save = (file, text, data) => {
            const indent = text.match(/^[ \t]+(?=")/m)?.[0] ?? '  ';
            writeFileSync(file, JSON.stringify(data, null, indent) + (text.endsWith('\n') ? '\n' : ''));
          };
          const pkgText = readFileSync('package.json', 'utf8');
          const pkg = JSON.parse(pkgText);
          const replaced = [];
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            for (const [name, spec] of Object.entries(pkg[section] ?? {})) {
              if (!name.startsWith(process.env.SCOPE) || !/^file:.*\.tgz$/.test(spec)) continue;
              const version = execFileSync('npm', ['view', `${name}@${process.env.DIST_TAG}`, 'version'], { encoding: 'utf8' }).trim();
              if (!version) throw new Error(`${name} has no published version tagged ${process.env.DIST_TAG}`);
              console.log(`${section}: ${name} ${spec} -> ^${version}`);
              // Same section, new range: the package stays a dependency or dev dependency.
              pkg[section][name] = `^${version}`;
              replaced.push(`${name}@^${version}`);
            }
          }
          if (replaced.length === 0) console.log('No local tarball dependencies.');
          else {
            save('package.json', pkgText, pkg);
            // Drop the lock's entries for those packages (they point at the tarballs), so npm
            // resolves them from the registry. Everything else stays locked.
            if (existsSync('package-lock.json')) {
              const lockText = readFileSync('package-lock.json', 'utf8');
              const lock = JSON.parse(lockText);
              const names = replaced.map((r) => r.slice(0, r.lastIndexOf('@')));
              for (const key of Object.keys(lock.packages ?? {})) {
                if (names.some((n) => key === `node_modules/${n}` || key.startsWith(`node_modules/${n}/`))) delete lock.packages[key];
              }
              const root = lock.packages?.[''];
              if (root) for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
                for (const name of names) if (root[section]?.[name] !== undefined) root[section][name] = pkg[section][name];
              }
              save('package-lock.json', lockText, lock);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `replaced=${replaced.join(' ')}\n`);
          EOF

      - name: Install the published versions
        if: steps.find.outputs.replaced != ''
        run: |
          npm install
          if grep -n '"file:[^"]*\.tgz"' package.json package-lock.json; then
            echo "::error::Local tarball references are still in package.json or package-lock.json."
            exit 1
          fi
          git diff --stat -- package.json package-lock.json

      - name: Verify
        if: steps.find.outputs.replaced != ''
        env:
          VERIFY: ${{ inputs.verify }}
        run: eval "$VERIFY"

      - name: Commit to the pull request branch
        if: steps.find.outputs.replaced != ''
        env:
          MESSAGE: ${{ inputs.commit-message }}
          REPLACED: ${{ steps.find.outputs.replaced }}
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m "$MESSAGE" -m "Published versions: $REPLACED"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "### Switched to published packages" >> "$GITHUB_STEP_SUMMARY"
          for p in $REPLACED; do echo "- \`$p\`" >> "$GITHUB_STEP_SUMMARY"; done
