name: Site database

# Reusable nightly checks of a site's schema in its Supabase project:
#   backup     pg_dump of the schema, restored into a scratch Postgres to prove it restores, then
#              encrypted and kept as a workflow artifact for 30 days.
#   checks     keeps the project awake (free projects pause after a week without traffic), fails
#              if a table lacks row level security or anything is open to signed-out callers, and
#              fails when the site reported errors in the last day (so GitHub emails you).
#
# Call it from the site's .github/workflows/database.yml (build-tools template `database.yml`):
#
#   on:
#     schedule:
#       - cron: '17 6 * * *'
#     workflow_dispatch:
#   jobs:
#     database:
#       uses: bnelson729/wells-nelson-components/.github/workflows/site-database.yml@v2
#       secrets: inherit
#       with:
#         schema: my_site
#
# `secrets: inherit` is required: a called workflow only sees the secrets its caller passes, and
# environment secrets (SUPABASE_DB_PASSWORD) can't be passed one by one, since the calling job has
# no environment. Without it psql fails with "no password supplied".
#
# The steps are this repository's composite actions (.github/actions/postgres-client, schema-backup,
# schema-checks), which run the SQL in ops/sql for the given schema; the site keeps none of it.
# They're called at @v2, like this workflow, so move the tag for both together. Both jobs run in
# the site repository's `database` environment (limited to main), which holds the variable
# SUPABASE_DB_URL (the session pooler connection string, without the password) and the secret
# SUPABASE_DB_PASSWORD (given to psql as PGPASSWORD; it also encrypts the backups). The keep-alive
# reads the repository variables SUPABASE_URL and SUPABASE_ANON_KEY.

on:
  workflow_call:
    inputs:
      schema:
        description: The site's Postgres schema
        type: string
        required: true
      pg-major:
        description: Postgres major version of the client tools and the scratch database (match Supabase's)
        type: string
        default: '17'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: database
    services:
      scratch:
        image: postgres:${{ inputs.pg-major }}
        env:
          POSTGRES_PASSWORD: scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: bnelson729/wells-nelson-components/.github/actions/postgres-client@v2
        with:
          pg-major: ${{ inputs.pg-major }}

      - id: backup
        uses: bnelson729/wells-nelson-components/.github/actions/schema-backup@v2
        with:
          schema: ${{ inputs.schema }}
          db-url: ${{ vars.SUPABASE_DB_URL }}
          password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          scratch-url: postgres://postgres:scratch@localhost:5432/postgres

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.schema }}-backup
          path: ${{ steps.backup.outputs.file }}
          retention-days: 30
          if-no-files-found: error

  checks:
    runs-on: ubuntu-latest
    environment: database
    steps:
      - name: Keep the project awake
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health"

      - uses: bnelson729/wells-nelson-components/.github/actions/postgres-client@v2
        with:
          pg-major: ${{ inputs.pg-major }}

      - uses: bnelson729/wells-nelson-components/.github/actions/schema-checks@v2
        with:
          schema: ${{ inputs.schema }}
          db-url: ${{ vars.SUPABASE_DB_URL }}
          password: ${{ secrets.SUPABASE_DB_PASSWORD }}
